[package]
name = "pinac-workspace"
version = "3.1.0"
description = "AI desktop assistant for professionals, built with React and Tauri"
authors = ["RajeshTechForge"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pinac_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
thiserror = "2"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"

# ── Auth / deep-link plugins (desktop only) ──────────────────────────────────
# tauri-plugin-deep-link  — provides the pinac:// URI scheme handler and the
#   onOpenUrl JS API used by deepLinkHandler.ts.  Required for the capability
#   permission "deep-link:default" and for app.deep_link().register().
# tauri-plugin-single-instance — ensures that when the OS opens a deep link
#   while the app is already running (Windows/Linux spawns a 2nd process), the
#   URL is forwarded to the primary instance via argv[1] in the init() callback.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-deep-link = "2.0.0"
tauri-plugin-single-instance = "2.4.3"
